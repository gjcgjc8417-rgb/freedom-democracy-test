<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自由与民主｜政治哲学思想实验</title><style>
:root{--bg:#0d1220;--panel:#171f31;--line:#303a50;--text:#eef2ff;--muted:#aeb9cf;--accent:#9db6ff;--gold:#eac99b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0%,#283652 0%,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft Yahei",sans-serif}main{max-width:820px;margin:auto;padding:28px 18px 65px}.eyebrow{letter-spacing:.19em;color:var(--gold);font-size:12px}h1{font-size:clamp(32px,7vw,56px);line-height:1.15;margin:20px 0}p{line-height:1.8;color:var(--muted)}.intro{max-width:640px}.card{background:rgba(23,31,49,.94);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,36px);margin-top:30px;box-shadow:0 20px 50px #0002}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.bar{height:5px;background:#303a50;border-radius:5px;margin:16px 0 30px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#9db6ff,#eac99b);transition:width .25s}.question{font-size:clamp(21px,4.5vw,29px);line-height:1.5;margin:0 0 14px}.scene{font-size:15px;margin-bottom:24px}.choices{display:grid;gap:12px}.choice{width:100%;text-align:left;background:#202a3e;color:var(--text);border:1px solid #3b4861;border-radius:13px;padding:16px 18px;cursor:pointer;font-size:15px;line-height:1.65;transition:.15s}.choice:hover{border-color:var(--accent)}.choice.selected{background:#2b3c5b;border-color:var(--accent);box-shadow:inset 4px 0 var(--accent)}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:25px}button.primary,button.secondary{border-radius:11px;padding:13px 20px;font-weight:650;cursor:pointer;font-size:15px}button.primary{background:var(--accent);color:#101a2b;border:0}button.secondary{background:transparent;border:1px solid #65718b;color:var(--text)}button:disabled{opacity:.35;cursor:not-allowed}.hidden{display:none!important}.resultTitle{font-size:29px;margin:12px 0}.pill{display:inline-block;border:1px solid #5c6880;border-radius:100px;padding:6px 11px;color:var(--gold);font-size:12px}.metric{margin:23px 0}.metricHead{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:9px}.track{height:10px;background:#334057;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#87a7ff,#eac99b);border-radius:20px}.interpret{background:#222d43;border-left:3px solid var(--gold);padding:15px 19px;border-radius:0 12px 12px 0;margin:22px 0}.interpret p{margin:4px 0}.small{font-size:13px}.answerReview{border-top:1px solid var(--line);padding:14px 0}.answerReview strong{font-size:14px}.answerReview p{font-size:13px;margin:5px 0}.footer{margin-top:22px;font-size:12px;color:#8694ad}a{color:var(--accent)}@media(max-width:500px){.actions button{flex:1}.card{margin-top:22px}}
</style></head><body><main><div class="eyebrow">A POLITICAL PHILOSOPHY EXERCISE · 2026</div><h1>自由，<br>由谁决定？</h1><p class="intro">10 道情境题，探索你如何理解自由、民主、权利与公共利益。没有标准答案，也不会将你简单归入某个政治阵营。</p><section class="card" id="quiz"><div class="top"><span id="counter">01 / 10</span><span>思想实验 · 单选</span></div><div class="bar"><div id="progress" style="width:10%"></div></div><h2 class="question" id="question"></h2><p class="scene" id="scene"></p><div class="choices" id="choices"></div><div class="actions"><button class="secondary" id="back">上一题</button><button class="primary" id="next" disabled>下一题 →</button></div></section><section class="card hidden" id="result"><span class="pill">YOUR PHILOSOPHICAL PROFILE</span><h2 class="resultTitle" id="profile"></h2><p id="summary"></p><div id="metrics"></div><div class="interpret"><strong>你的主要权衡方式</strong><p id="reading"></p></div><h3>你的选择回顾</h3><div id="review"></div><p class="footer">结果仅是基于本次回答的描述性倾向，不是心理测量量表、政治身份鉴定或对观点正确性的评分。分数只表示在本测试设定的情境中更偏向哪一端。</p><div class="actions"><button class="secondary" id="restart">重新测试</button><button class="primary" id="copy">复制我的结果</button></div></section><p class="footer">设计原则：区分言论与行为、程序与权利、个人利益与公共福祉。所有题目均为假设情境。</p></main><script>
const dimensions=[{id:'rights',name:'基本权利优先',low:'多数决定优先',high:'基本权利优先'},{id:'speech',name:'表达宽容',low:'预防性限制',high:'广泛表达宽容'},{id:'process',name:'程序正当性',low:'结果优先',high:'程序优先'},{id:'welfare',name:'公共利益权衡',low:'个人权益优先',high:'总体福祉优先'}];
const qs=[
{q:'多数人能否决定少数人的言论自由？',s:'90% 的人投票要求禁止剩余 10% 的人表达不受欢迎但不直接伤害他人的观点。',a:[['支持，多数人的决定应被执行',{rights:-2,speech:-2,process:1}],['反对，基本言论权利不能被多数票随意取消',{rights:2,speech:2}],['应由独立审查判断是否存在具体伤害',{rights:1,speech:1,process:1}]]},
{q:'允许反自由政党参加选举吗？',s:'一个政党公开主张未来取消言论自由，但目前没有威胁他人或实施暴力。',a:[['允许，不能仅凭主张剥夺参选资格',{speech:2,process:2}],['禁止，以免其未来破坏民主',{speech:-2,rights:1}],['允许表达，但参选须符合严格的宪法保障条件',{speech:1,rights:1,process:1}]]},
{q:'合法修宪可以取消民主吗？',s:'某政党通过现行合法程序，试图永久取消竞争性选举和言论自由。',a:[['尊重合法程序，即使不认同结果',{process:2,rights:-2}],['不应允许多数人永久取消基本政治权利',{rights:2,process:-1}],['需要看是否有不可修改的权利条款及审查机制',{rights:1,process:1}]]},
{q:'如果被限制的是你自己呢？',s:'多数人通过合法程序，决定仅取消你所属少数群体的公开批评权。',a:[['接受程序结果，即使个人不满',{process:2,rights:-2}],['反对，基本权利不能由人数决定',{rights:2,speech:1}],['反对决定，但会通过合法渠道寻求救济',{rights:2,process:1}]]},
{q:'99 个人获益，1 个人受损',s:'一座工厂能改善 99 人的生活，但将严重损害另一人的合法利益。',a:[['仍然建设，整体收益更重要',{welfare:2,rights:-1}],['不建设，不能以多数收益牺牲个人',{welfare:-2,rights:1}],['寻找替代选址或充分补偿后再决定',{welfare:1,rights:1}]]},
{q:'是否允许反对自由的公开言论？',s:'某团体公开批评言论自由制度，但没有煽动暴力或威胁他人。',a:[['允许公开辩论和反驳',{speech:2}],['禁止宣传，防止长期风险',{speech:-2,rights:1}],['原则上允许，但对具体违法煽动设限',{speech:1,rights:1}]]},
{q:'公共秩序与个人表达发生冲突',s:'一场合法和平集会引发交通不便，参与者并未威胁他人。',a:[['允许集会，尽量协调交通',{speech:2,rights:1}],['禁止集会，公共秩序更重要',{speech:-2,welfare:1}],['设置时间地点限制，同时保留有效表达机会',{speech:1,welfare:1}]]},
{q:'谁有权限制政治表达？',s:'某种言论可能违法，政府提出由行政机关直接决定是否禁止。',a:[['可以由行政机关快速决定',{process:-1,speech:-1}],['必须有明确法律、独立审查和救济',{process:2,rights:2}],['应由公民投票决定具体禁止哪些观点',{process:1,rights:-1}]]},
{q:'个人财产权与公共服务',s:'政府计划通过更高的累进税支持基础教育和医疗。',a:[['支持，公共服务与机会平等更重要',{welfare:2}],['反对，个人财产自主更重要',{welfare:-2}],['视税率、效果、透明度和负担而定',{welfare:0,process:1}]]},
{q:'规则由谁来改变？',s:'现行法律受到广泛批评，但改革需要经过较长的公开讨论和立法程序。',a:[['优先遵循程序，即使改革较慢',{process:2}],['若结果明显有益，应尽快绕过繁琐程序',{process:-2,welfare:1}],['可以加速程序，但仍需公开监督与权利保障',{process:1,rights:1}]]}
];
let idx=0;let answers=Array(qs.length).fill(null);const $=x=>document.getElementById(x);function render(){let q=qs[idx];$('counter').textContent=String(idx+1).padStart(2,'0')+' / '+qs.length;$('progress').style.width=((idx+1)/qs.length*100)+'%';$('question').textContent=q.q;$('scene').textContent=q.s;$('choices').innerHTML='';q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='choice'+(answers[idx]===i?' selected':'');b.textContent=String.fromCharCode(65+i)+'. '+a[0];b.onclick=()=>{answers[idx]=i;render()};$('choices').appendChild(b)});$('back').disabled=idx===0;$('next').disabled=answers[idx]===null;$('next').textContent=idx===qs.length-1?'查看我的分析 →':'下一题 →'}
$('back').onclick=()=>{if(idx>0){idx--;render()}};$('next').onclick=()=>{if(answers[idx]===null)return;if(idx<qs.length-1){idx++;render()}else showResult()};
function calculate(){const sums=Object.fromEntries(dimensions.map(d=>[d.id,0]));const maximum=Object.fromEntries(dimensions.map(d=>[d.id,0]));qs.forEach((q,i)=>{dimensions.forEach(d=>{maximum[d.id]+=Math.max(...q.a.map(a=>Math.abs(a[1][d.id]||0)))});let sc=q.a[answers[i]][1];Object.keys(sc).forEach(k=>sums[k]+=sc[k])});return Object.fromEntries(dimensions.map(d=>[d.id,Math.round(50+50*sums[d.id]/(maximum[d.id]||1))]))}
function classify(v){return v>=65?'较倾向'+(v>=80?'（明显）':''):v<=35?'较倾向另一端'+(v<=20?'（明显）':''):'情境权衡 / 中间倾向'}
function showResult(){const scores=calculate();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const r=scores.rights,sp=scores.speech,pr=scores.process,w=scores.welfare;let label=r>=65&&sp>=65?'基本权利与表达宽容取向':r>=65&&sp<45?'权利保护与预防性限制并重':pr>=65?'程序正当性取向':w>=65?'公共福祉权衡取向':'情境权衡型';$('profile').textContent=label;$('summary').textContent='你在不同情境中对基本权利、政治表达、合法程序和公共福祉赋予了不同权重。以下展示的是连续倾向，而不是政治身份标签。';$('metrics').innerHTML=dimensions.map(d=>{let v=scores[d.id];return `<div class="metric"><div class="metricHead"><span>${d.low}</span><strong>${d.name} ${v}/100</strong><span>${d.high}</span></div><div class="track"><div class="fill" style="width:${v}%"></div></div></div>`}).join('');let statements=[];statements.push(r>=65?'你在多数决与基本权利冲突时，更重视基本权利。':r<=35?'你更愿意让集体决策决定权利边界。':'你对多数决与基本权利的取舍较依赖具体情境。');statements.push(sp>=65?'你倾向于容忍自己反对的观点，只在更具体的伤害风险出现时考虑限制。':sp<=35?'你较重视提前防范可能危及自由的表达。':'你倾向于根据风险和具体行为决定表达边界。');statements.push(pr>=65?'你赋予合法程序和可审查的制度较高权重。':pr<=35?'你更愿意在程序与预期结果冲突时优先考虑结果。':'你会同时权衡程序与结果。');statements.push(w>=65?'你在资源和利益分配中较重视总体福祉。':w<=35?'你在公共收益与个人利益冲突时更重视个人权益。':'你倾向于寻求补偿、替代方案或条件性平衡。');$('reading').textContent=statements.join(' ');$('review').innerHTML=qs.map((q,i)=>`<div class="answerReview"><strong>${i+1}. ${q.q}</strong><p>${'ABC'[answers[i]]}. ${q.a[answers[i]][0]}</p></div>`).join('');window.scrollTo({top:0,behavior:'smooth'});window.resultText='自由与民主观测试\n'+label+'\n'+dimensions.map(d=>d.name+'：'+scores[d.id]+'/100').join('\n')+'\n'+statements.join('\n')+'\n（非科学诊断，仅为情境题观点总结）'}
$('restart').onclick=()=>{answers=Array(qs.length).fill(null);idx=0;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'smooth'})};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(window.resultText);$('copy').textContent='已复制 ✓'}catch(e){prompt('复制以下结果：',window.resultText)}};render();
</script></body></html>
